<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" role="img" aria-labelledby="t">
  <title id="t">Illustration of a web platform stack: React front end, Laravel API, PostgreSQL database and OpenAI integration</title>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#15202b" opacity=".13"/>
    </pattern>
  </defs>
  <rect x="20" y="20" width="480" height="520" fill="url(#dots)"/>

  <!-- connectors -->
  <g stroke="#15202b" stroke-width="2" fill="none" stroke-dasharray="5 6">
    <path d="M200 176v52"/>
    <path d="M200 334v52"/>
    <path d="M330 280h60v-118"/>
  </g>
  <g fill="#15202b">
    <circle cx="200" cy="228" r="4"/>
    <circle cx="200" cy="386" r="4"/>
    <circle cx="390" cy="162" r="4"/>
  </g>

  <!-- React front end: browser window -->
  <g transform="translate(60 56)">
    <rect x="6" y="6" width="280" height="118" fill="#15202b"/>
    <rect width="280" height="118" fill="#fff" stroke="#15202b" stroke-width="2"/>
    <path d="M0 26h280" stroke="#15202b" stroke-width="2"/>
    <circle cx="14" cy="13" r="4" fill="#15202b"/><circle cx="28" cy="13" r="4" fill="#d9d9d4"/><circle cx="42" cy="13" r="4" fill="#d9d9d4"/>
    <rect x="16" y="42" width="58" height="60" fill="#d9f99d"/>
    <rect x="86" y="42" width="120" height="10" fill="#15202b"/>
    <rect x="86" y="60" width="176" height="7" fill="#d9d9d4"/>
    <rect x="86" y="74" width="150" height="7" fill="#d9d9d4"/>
    <rect x="86" y="88" width="64" height="14" fill="#2458e6"/>
    <path d="M24 92l12-16 10 10 8-8 12 14" stroke="#15202b" stroke-width="2" fill="none"/>
    <text x="280" y="-10" text-anchor="end" font-family="DM Mono, monospace" font-size="12" fill="#5e6975">01 · REACT DASHBOARD</text>
  </g>

  <!-- Laravel API -->
  <g transform="translate(70 228)">
    <rect x="6" y="6" width="260" height="106" fill="#15202b"/>
    <rect width="260" height="106" fill="#15202b" stroke="#15202b" stroke-width="2"/>
    <text x="18" y="30" font-family="DM Mono, monospace" font-size="13" fill="#d9f99d">Route::apiResource(</text>
    <text x="34" y="52" font-family="DM Mono, monospace" font-size="13" fill="#fff">'applications',</text>
    <text x="34" y="74" font-family="DM Mono, monospace" font-size="13" fill="#fff">ApplicationController</text>
    <text x="18" y="94" font-family="DM Mono, monospace" font-size="13" fill="#d9f99d">)-&gt;middleware('auth');</text>
    <text x="0" y="128" font-family="DM Mono, monospace" font-size="12" fill="#5e6975">02 · LARAVEL API</text>
  </g>

  <!-- PostgreSQL -->
  <g transform="translate(140 386)">
    <path d="M0 22v76c0 12 27 22 60 22s60-10 60-22V22" fill="#fff" stroke="#15202b" stroke-width="2"/>
    <ellipse cx="60" cy="22" rx="60" ry="22" fill="#d9f99d" stroke="#15202b" stroke-width="2"/>
    <path d="M0 50c0 12 27 22 60 22s60-10 60-22M0 76c0 12 27 22 60 22s60-10 60-22" fill="none" stroke="#15202b" stroke-width="2"/>
    <text x="60" y="142" text-anchor="middle" font-family="DM Mono, monospace" font-size="12" fill="#5e6975">03 · POSTGRESQL</text>
  </g>

  <!-- OpenAI node -->
  <g transform="translate(352 100)">
    <rect width="76" height="62" fill="#2458e6"/>
    <path d="M38 14l6 13 13 6-13 6-6 13-6-13-13-6 13-6z" fill="#fff"/>
    <text x="38" y="-10" text-anchor="middle" font-family="DM Mono, monospace" font-size="12" fill="#5e6975">AI</text>
  </g>

  <!-- badge -->
  <g transform="translate(360 400)">
    <circle cx="56" cy="56" r="56" fill="#d9f99d" stroke="#15202b" stroke-width="2"/>
    <text x="56" y="58" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-weight="800" font-size="34" fill="#15202b">5+</text>
    <text x="56" y="80" text-anchor="middle" font-family="DM Mono, monospace" font-size="11" fill="#15202b">YEARS</text>
  </g>
</svg>
