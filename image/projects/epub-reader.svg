<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" role="img" aria-labelledby="t">
  <title id="t">An open book with text lines and sound waves for text-to-speech</title>
  <rect width="580" height="400" fill="#e9ecef"/>
  <!-- book -->
  <g transform="translate(70 80)" stroke="#15202b" stroke-width="3">
    <path d="M10 250V20c60-14 120-8 170 20 50-28 110-34 170-20v230c-60-14-120-8-170 20-50-28-110-34-170-20z" fill="#15202b" transform="translate(6 6)"/>
    <path d="M10 250V20c60-14 120-8 170 20 50-28 110-34 170-20v230c-60-14-120-8-170 20-50-28-110-34-170-20z" fill="#fff"/>
    <path d="M180 40v230"/>
  </g>
  <g fill="#d9d9d4">
    <rect x="104" y="130" width="120" height="8"/>
    <rect x="104" y="150" width="130" height="8"/>
    <rect x="104" y="170" width="110" height="8"/>
    <rect x="104" y="210" width="126" height="8"/>
    <rect x="104" y="230" width="96" height="8"/>
    <rect x="280" y="150" width="120" height="8"/>
    <rect x="280" y="210" width="110" height="8"/>
    <rect x="280" y="230" width="124" height="8"/>
    <rect x="280" y="250" width="90" height="8"/>
  </g>
  <rect x="104" y="104" width="80" height="12" fill="#15202b"/>
  <!-- highlighted line being read -->
  <rect x="276" y="124" width="136" height="16" fill="#d9f99d"/>
  <rect x="280" y="128" width="120" height="8" fill="#15202b"/>
  <rect x="280" y="170" width="128" height="8" fill="#d9d9d4"/>
  <rect x="280" y="190" width="100" height="8" fill="#d9d9d4"/>
  <!-- speaker + waves -->
  <g transform="translate(460 60)">
    <circle cx="40" cy="40" r="40" fill="#2458e6"/>
    <path d="M24 32h10l12-10v36L34 48H24z" fill="#fff"/>
    <path d="M52 30c5 5 5 15 0 20M58 24c9 9 9 23 0 32" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
