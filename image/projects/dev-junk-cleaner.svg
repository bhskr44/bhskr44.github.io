<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" role="img" aria-labelledby="t">
  <title id="t">A Windows app window listing developer junk folders with sizes, next to a disk usage gauge</title>
  <rect width="580" height="400" fill="#e9ecef"/>
  <!-- app window -->
  <g transform="translate(40 60)">
    <rect x="6" y="6" width="330" height="260" fill="#2458e6"/>
    <rect width="330" height="260" fill="#fff" stroke="#15202b" stroke-width="3"/>
    <rect width="330" height="30" fill="#15202b"/>
    <rect x="12" y="10" width="10" height="10" fill="#d9f99d"/>
    <rect x="292" y="13" width="10" height="3" fill="#c6ced8"/>
    <rect x="310" y="10" width="10" height="10" fill="none" stroke="#c6ced8" stroke-width="2"/>
    <g font-family="DM Mono, monospace" font-size="12">
      <text x="30" y="20" fill="#fff">Dev Junk Cleaner</text>
      <g fill="#15202b">
        <rect x="16" y="50" width="12" height="12" fill="#2458e6"/><text x="38" y="61">node_modules</text><text x="314" y="61" text-anchor="end">2.4 GB</text>
        <rect x="16" y="80" width="12" height="12" fill="#2458e6"/><text x="38" y="91">vendor</text><text x="314" y="91" text-anchor="end">860 MB</text>
        <rect x="16" y="110" width="12" height="12" fill="#2458e6"/><text x="38" y="121">.gradle</text><text x="314" y="121" text-anchor="end">1.7 GB</text>
        <rect x="16" y="140" width="12" height="12" fill="#2458e6"/><text x="38" y="151">.next</text><text x="314" y="151" text-anchor="end">540 MB</text>
        <rect x="16" y="170" width="12" height="12" fill="none" stroke="#5e6975" stroke-width="2"/><text x="38" y="181" fill="#5e6975">build  (in use)</text><text x="314" y="181" text-anchor="end" fill="#5e6975">310 MB</text>
      </g>
      <rect x="16" y="210" width="130" height="32" fill="#d9f99d"/>
      <text x="81" y="231" text-anchor="middle" fill="#15202b">Apply ticked</text>
      <text x="314" y="231" text-anchor="end" fill="#2458e6">5.5 GB freed</text>
    </g>
  </g>
  <!-- disk gauge -->
  <g transform="translate(470 190)">
    <circle r="62" fill="none" stroke="#d9d9d4" stroke-width="20"/>
    <circle r="62" fill="none" stroke="#2458e6" stroke-width="20" stroke-dasharray="195 390" transform="rotate(-90)"/>
    <circle r="40" fill="#15202b"/>
    <text y="6" text-anchor="middle" font-family="DM Mono, monospace" font-size="16" fill="#d9f99d">C:</text>
  </g>
</svg>
