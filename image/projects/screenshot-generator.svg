<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" role="img" aria-labelledby="t">
  <title id="t">A terminal running the screenshot generator next to framed phone screenshots</title>
  <rect width="580" height="400" fill="#e9ecef"/>
  <!-- terminal -->
  <g transform="translate(40 70)">
    <rect x="6" y="6" width="270" height="200" fill="#2458e6"/>
    <rect width="270" height="200" fill="#15202b"/>
    <circle cx="16" cy="16" r="4" fill="#d9f99d"/><circle cx="30" cy="16" r="4" fill="#5e6975"/><circle cx="44" cy="16" r="4" fill="#5e6975"/>
    <g font-family="DM Mono, monospace" font-size="12">
      <text x="16" y="52" fill="#d9f99d">$ npx playstore-shots</text>
      <text x="16" y="74" fill="#c6ced8">  --url build/web</text>
      <text x="16" y="96" fill="#c6ced8">  --frame pixel</text>
      <text x="16" y="126" fill="#fff">✓ home.png</text>
      <text x="16" y="146" fill="#fff">✓ profile.png</text>
      <text x="16" y="166" fill="#fff">✓ settings.png</text>
      <rect x="16" y="178" width="9" height="14" fill="#d9f99d"/>
    </g>
  </g>
  <!-- phones -->
  <g stroke="#15202b" stroke-width="3">
    <g transform="translate(345 60)">
      <rect width="100" height="200" rx="16" fill="#15202b"/>
      <rect x="8" y="14" width="84" height="172" rx="8" fill="#fff"/>
      <rect x="18" y="30" width="64" height="44" fill="#d9f99d" stroke="none"/>
      <rect x="18" y="84" width="54" height="7" fill="#d9d9d4" stroke="none"/>
      <rect x="18" y="98" width="40" height="7" fill="#d9d9d4" stroke="none"/>
      <rect x="18" y="150" width="64" height="18" fill="#2458e6" stroke="none"/>
    </g>
    <g transform="translate(435 130)">
      <rect width="100" height="200" rx="16" fill="#15202b"/>
      <rect x="8" y="14" width="84" height="172" rx="8" fill="#fff"/>
      <circle cx="50" cy="52" r="20" fill="#2458e6" stroke="none"/>
      <rect x="22" y="86" width="56" height="8" fill="#15202b" stroke="none"/>
      <rect x="18" y="108" width="64" height="12" fill="#d9f99d" stroke="none"/>
      <rect x="18" y="126" width="64" height="12" fill="#d9d9d4" stroke="none"/>
      <rect x="18" y="144" width="64" height="12" fill="#d9d9d4" stroke="none"/>
    </g>
  </g>
</svg>
